<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lười CoFFe | Cà phê & Trà sữa Cần Thơ</title>

<!-- Thư viện EmailJS SDK đặt ở head để luôn nạp trước -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
/* ===== GIAO DIỆN CHUNG ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 100px;
}

body {
    font-family: Arial, sans-serif;
    background: #fffaf3;
    color: #39271e;
    line-height: 1.6;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: auto;
}

section {
    padding: 65px 0;
}

h2 {
    text-align: center;
    color: #9d2932;
    font-size: 30px;
    margin-bottom: 30px;
}

.btn, button {
    display: inline-block;
    background: #a82932;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.btn:hover, button:hover {
    background: #782027;
}

/* ===== 1. THANH ĐIỀU HƯỚNG ===== */
header {
    background: #a82932;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 10px #0002;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    padding: 16px 0;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #fff0d6;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
}

nav a {
    color: white;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
}

nav a:hover {
    color: #ffdb99;
}

/* ===== 2. TRANG CHỦ ===== */
.banner {
    min-height: 450px;
    display: flex;
    align-items: center;
    color: white;
    background:
        linear-gradient(90deg, #352013dd, #35201333),
        url("https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=1400")
        center / cover no-repeat;
}

.banner-content {
    max-width: 650px;
}

.banner h1 {
    font-size: clamp(34px, 5vw, 55px);
    line-height: 1.2;
    margin-bottom: 20px;
}

.banner p {
    font-size: 20px;
    margin-bottom: 25px;
}

/* ===== 3. ƯU ĐÃI THÀNH VIÊN ===== */
.member {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 35px;
    border-radius: 12px;
    overflow: hidden;
}

.member-left {
    background: #e52b39;
    color: white;
    padding: 45px 35px;
}

.member-left h2 {
    color: white;
    text-align: left;
    font-size: 36px;
    margin-bottom: 12px;
}

.member-right {
    background: #f6e8d5;
    padding: 45px 35px;
    text-align: center;
}

.member-right h2 {
    font-size: 25px;
    margin-bottom: 15px;
}

.member-right .btn {
    margin-top: 20px;
}

/* ===== 4. TIỂU SỬ QUÁN ===== */
.about-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.about-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 4px 15px #0001;
    padding-bottom: 25px;
}

.about-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.about-card h3 {
    color: #a82932;
    margin: 15px;
}

.about-card p {
    padding: 0 18px;
}

/* ===== 5. THỰC ĐƠN ===== */
.menu-section {
    background: #f5eadb;
}

.menu-intro {
    text-align: center;
    margin-bottom: 35px;
    color: #765b4a;
    font-size: 17px;
}

.category-title {
    font-size: 25px;
    color: #922c32;
    margin: 35px 0 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid #dfc6ab;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 22px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
    padding-bottom: 22px;
    box-shadow: 0 4px 12px #0001;
    transition: transform 0.2s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.product h3 {
    margin: 15px 8px 5px;
    font-size: 19px;
}

.product p {
    color: #786457;
    font-size: 14px;
    padding: 0 10px;
    min-height: 45px;
}

.price {
    display: block;
    color: #a82932;
    font-size: 21px;
    font-weight: bold;
    margin: 12px 0;
}

.product button {
    margin: 5px 10px;
}

/* ===== 6. GIỎ HÀNG ===== */
.order-box {
    max-width: 650px;
    margin: auto;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 18px #0001;
}

.order-box h3 {
    margin-bottom: 15px;
}

.cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.cart-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.cart-controls button {
    padding: 5px 10px;
}

.remove-btn {
    background: #777;
}

.total {
    text-align: right;
    font-size: 22px;
    color: #a82932;
    margin: 25px 0;
}

form label {
    display: block;
    font-weight: bold;
    margin: 15px 0 6px;
}

form input,
form textarea {
    display: block;
    width: 100%;
    padding: 12px;
    border: 1px solid #d2c4b5;
    border-radius: 6px;
    font: inherit;
}

form button {
    width: 100%;
    margin-top: 25px;
}

/* ===== 7. HỖ TRỢ ===== */
.support {
    background: #f5eadb;
    text-align: center;
}

.support p {
    margin: 12px 0;
}

/* ===== 8. ĐỊA CHỈ ===== */
.address {
    text-align: center;
}

.address-card {
    max-width: 800px;
    margin: auto;
    background: white;
    border: 2px solid #e7d4bf;
    padding: 35px;
    border-radius: 12px;
}

.address-card h3
