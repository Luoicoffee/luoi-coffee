<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lười CoFFe | Cà phê & Trà sữa Cần Thơ</title>

<!-- Thư viện EmailJS SDK đặt ở head để luôn nạp trước -->

<style>
/* ===== GIAO DIỆN CHUNG ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 100px;
}

body {
    font-family: Arial, sans-serif;
    background: #fffaf3;
    color: #39271e;
    line-height: 1.6;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: auto;
}

section {
    padding: 65px 0;
}

h2 {
    text-align: center;
    color: #9d2932;
    font-size: 30px;
    margin-bottom: 30px;
}

.btn, button {
    display: inline-block;
    background: #a82932;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.btn:hover, button:hover {
    background: #782027;
}

/* ===== 1. THANH ĐIỀU HƯỚNG ===== */
header {
    background: #a82932;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 10px #0002;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    padding: 16px 0;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #fff0d6;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
}

nav a {
    color: white;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
}

nav a:hover {
    color: #ffdb99;
}

/* ===== 2. TRANG CHỦ ===== */
.banner {
    min-height: 450px;
    display: flex;
    align-items: center;
    color: white;
    background:
        linear-gradient(90deg, #352013dd, #35201333),
        url("https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=1400")
        center / cover no-repeat;
}

.banner-content {
    max-width: 650px;
}

.banner h1 {
    font-size: clamp(34px, 5vw, 55px);
    line-height: 1.2;
    margin-bottom: 20px;
}

.banner p {
    font-size: 20px;
    margin-bottom: 25px;
}
